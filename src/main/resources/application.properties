quarkus.native.container-build=true
quarkus.native.additional-build-args=--enable-url-protocols=https

quarkus.http.root-path=/api

mp.messaging.incoming.data.connector=quarkus-http
mp.messaging.incoming.data.path=/upload
mp.messaging.incoming.data.method=POST

mp.messaging.outgoing.resources.connector=quarkus-http
mp.messaging.outgoing.resources.serializer=com.streamx.reactive.messaging.http.CloudEventJsonSerializer
mp.messaging.outgoing.resources.url=${STREAMX_ENDPOINT_RESOURCES}
mp.messaging.outgoing.resources.twoPhaseResponseFlow=true
mp.messaging.outgoing.resources.protocol=HTTP_2

#example resource type mapping:
#streamx.contentful.connector.resource-type-mappings."pageProduct"=data/product

# Default:
streamx.contentful.connector.contentful-assets-url=https://cdn.contentful.com/spaces/${streamx.contentful.connector.space-id}/environments/${streamx.contentful.connector.environment}/assets
streamx.contentful.connector.contentful-entries-url=https://cdn.contentful.com/spaces/${streamx.contentful.connector.space-id}/environments/${streamx.contentful.connector.environment}/entries

# Default Mappings:
streamx.contentful.connector.topic-mappings."ContentManagement.Entry.publish"=com.streamx.blueprints.data.published.v1
